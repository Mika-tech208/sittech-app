# Escala de Produção — FALLBACK da outbox.
#
# O fluxo normal recalcula a Escala na hora (o navegador chama
# /api/escala/processar logo após a ação). Este workflow é só a rede de
# segurança: a cada 5 minutos chama /api/escala/drenar, que processa eventos
# pendentes, com erro (até 3 tentativas) e "processando" travado — mesmo com
# todas as telas fechadas. A rota é idempotente e respeita os locks/versões
# da Escala, então rodar junto com a chamada imediata não duplica nada.
#
# Segredos (somente em GitHub Actions Secrets — nunca no repositório):
#   ESCALA_DRENAR_URL           URL completa, ex.: https://<dominio>/api/escala/drenar
#   CRON_SECRET                 o mesmo valor configurado no Vercel
#   VERCEL_PROTECTION_BYPASS    OPCIONAL — só para alvos com Deployment Protection (Preview)
#
# Observação do GitHub: o agendamento (`schedule`) só dispara a partir da
# branch padrão do repositório.

name: Escala - drenar outbox (fallback)

on:
  schedule:
    - cron: "*/5 * * * *"
    # Revalidação da disponibilidade das máquinas 5 min ANTES de cada período (07:07, 08:43, 10:19, 12:55, 14:15, 15:35 em
    # America/Sao_Paulo = UTC−3, sem horário de verão), seg–sáb. REDUNDÂNCIA: o GitHub atrasa/pula agendamentos — a garantia vem do
    # evento imediato da Parada, da pré-checagem do navegador (TV/Escala) e do próprio /api/escala/drenar (idempotente). Os horários
    # reais dos períodos vêm do banco (tabela periodos); estes minutos só aproximam. A rota decide sozinha se está na janela.
    - cron: "7 10 * * 1-6"
    - cron: "43 11 * * 1-6"
    - cron: "19 13 * * 1-6"
    - cron: "55 15 * * 1-6"
    - cron: "15 17 * * 1-6"
    - cron: "35 18 * * 1-6"

concurrency:
  group: escala-drenar
  cancel-in-progress: false

permissions: {}

jobs:
  drenar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar /api/escala/drenar
        env:
          ESCALA_DRENAR_URL: ${{ secrets.ESCALA_DRENAR_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          if [ -z "${ESCALA_DRENAR_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Secrets ESCALA_DRENAR_URL e CRON_SECRET precisam estar configurados."
            exit 1
          fi

          # cabeçalhos num arquivo (fora da linha de comando)
          umask 077
          {
            echo "Authorization: Bearer ${CRON_SECRET}"
            if [ -n "${VERCEL_PROTECTION_BYPASS}" ]; then
              echo "x-vercel-protection-bypass: ${VERCEL_PROTECTION_BYPASS}"
            fi
          } > headers.txt

          code=$(curl -sS --max-time 70 --retry 2 --retry-delay 5 --retry-all-errors \
            -H @headers.txt -o resposta.json -w '%{http_code}' "${ESCALA_DRENAR_URL}") || code="000"
          rm -f headers.txt

          echo "HTTP ${code}"
          cat resposta.json 2>/dev/null || true
          echo

          if [ "${code}" != "200" ]; then
            echo "::error::Drenagem da Escala falhou (HTTP ${code})."
            exit 1
          fi

          erros=$(jq -r '.erros // 0' resposta.json)
          esgotados=$(jq -r '.esgotados // 0' resposta.json)
          if [ "${erros}" != "0" ]; then
            echo "::warning::${erros} evento(s) da Escala falharam neste ciclo (serão tentados de novo)."
          fi
          falhas_rel=$(jq -r '[.relatorios[]? | select(.acao == "erro_geracao" or .acao == "esgotado")] | length' resposta.json)
          if [ "${falhas_rel}" != "0" ]; then
            echo "::warning::Relatório semanal da Escala: ${falhas_rel} semana(s) com falha na geração (nova tentativa automática em ~10 min; ver a tela de relatórios)."
          fi
          if [ "${esgotados}" != "0" ]; then
            echo "::error::${esgotados} evento(s) da Escala esgotaram as tentativas — use 'Tentar novamente' na tela Escala de Produção."
            exit 1
          fi
